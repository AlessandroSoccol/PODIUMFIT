services:
  django:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      DJANGO_SETTINGS_MODULE: PodiumFit.settings
      DJANGO_DB_PATH: /data/db.sqlite3
      NOTIFICADOR_MODE: ${NOTIFICADOR_MODE:-MOCK}
      CELERY_BROKER_URL: redis://redis_broker:6379/0
    volumes:
      - ./:/data
    depends_on:
      - redis_broker
    restart: unless-stopped

  cuentas:
    build:
      context: ./cuentas_service
      dockerfile: Dockerfile
    expose:
      - "5000"
    environment:
      CUENTAS_DB_PATH: /data/db.sqlite3
      CUENTAS_SECRET_KEY: ${CUENTAS_SECRET_KEY:-cambia-esta-clave-en-produccion}
      CUENTAS_DOMINIO: "@eafit.edu.co"
      CUENTAS_PBKDF2_ITERATIONS: "1500000"
    volumes:
      - ./:/data
    depends_on:
      - django
    restart: unless-stopped

  datos:
    build:
      context: ./datos_service
      dockerfile: Dockerfile
    expose:
      - "5000"
    restart: unless-stopped

  redis_broker:
    image: redis:7-alpine
    restart: unless-stopped

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A PodiumFit worker -l info
    environment:
      DJANGO_SETTINGS_MODULE: PodiumFit.settings
      DJANGO_DB_PATH: /data/db.sqlite3
      NOTIFICADOR_MODE: ${NOTIFICADOR_MODE:-MOCK}
      CELERY_BROKER_URL: redis://redis_broker:6379/0
    volumes:
      - ./:/data
    depends_on:
      - redis_broker
      - django
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - django
      - cuentas
      - datos
    restart: unless-stopped
