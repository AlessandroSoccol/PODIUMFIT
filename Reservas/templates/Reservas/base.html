<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Reservas{% endblock %} · PodiumFit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0D1B2A;
            --navy-mid: #12233D;
            --navy-light: #1B3253;
            --white: #FFFFFF;
            --paper: #F4F6F9;
            --ink: #182430;
            --ink-soft: #5B6673;
            --line: #E1E6ED;
            --danger: #B3403A;
            --danger-bg: #FBEAE8;
            --success: #2E7D46;
            --success-bg: #E9F5EC;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--ink);
            background: var(--paper);
        }
        a { color: inherit; }

        header.app-header {
            background: var(--navy);
            color: var(--white);
            padding: 0 24px;
        }
        .app-header .header-inner {
            max-width: 880px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            padding: 16px 0;
        }
        .brand {
            font-family: 'Big Shoulders Display', sans-serif;
            font-weight: 700;
            font-size: 24px;
            letter-spacing: 0.02em;
            text-decoration: none;
            color: var(--white);
        }
        nav.app-nav {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        nav.app-nav a {
            text-decoration: none;
            color: rgba(255, 255, 255, 0.82);
            font-size: 14px;
            font-weight: 500;
            padding: 8px 12px;
            border-radius: 6px;
            transition: background 0.15s ease, color 0.15s ease;
        }
        nav.app-nav a:hover,
        nav.app-nav a.activo {
            background: var(--navy-light);
            color: var(--white);
        }
        form.logout-form { margin: 0; }
        .logout-btn {
            background: transparent;
            color: var(--white);
            border: 1px solid rgba(255, 255, 255, 0.35);
            padding: 8px 14px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        .logout-btn:hover { background: rgba(255, 255, 255, 0.12); }

        main.app-main {
            max-width: 880px;
            margin: 0 auto;
            padding: 32px 24px 64px;
        }

        h1 {
            font-family: 'Big Shoulders Display', sans-serif;
            font-weight: 700;
            font-size: 30px;
            color: var(--navy);
            margin: 0 0 20px;
        }
        h2 {
            font-family: 'Big Shoulders Display', sans-serif;
            font-weight: 600;
            font-size: 20px;
            color: var(--navy-mid);
            margin: 32px 0 12px;
        }

        .boton {
            display: block;
            padding: 14px 16px;
            margin: 10px 0;
            background: var(--navy);
            color: var(--white);
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }
        .boton:hover { background: var(--navy-light); }

        .error {
            color: var(--danger);
            background: var(--danger-bg);
            border: 1px solid #EFC3BF;
            padding: 10px 14px;
            border-radius: 6px;
        }
        .aviso {
            color: var(--navy-mid);
            background: var(--white);
            border: 1px solid var(--line);
            border-left: 4px solid var(--navy);
            padding: 10px 14px;
            border-radius: 6px;
        }

        ul.lista-tarjetas { list-style: none; padding: 0; margin: 0; }
        li.tarjeta {
            background: var(--white);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .tarjeta .titulo-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-weight: 600;
            color: var(--ink);
        }
        .tarjeta .disponibilidad { color: var(--ink-soft); font-weight: 500; }

        form.form-reserva {
            margin-top: 12px;
            display: flex;
            gap: 12px;
            align-items: end;
            flex-wrap: wrap;
        }
        label { display: block; font-size: 13px; font-weight: 500; color: var(--ink-soft); margin-top: 6px; }
        input, select {
            width: 100%;
            padding: 8px 10px;
            margin-top: 4px;
            border: 1px solid var(--line);
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            background: var(--white);
            color: var(--ink);
        }
        button[type="submit"] {
            margin-top: 16px;
            padding: 10px 18px;
            background: var(--navy);
            color: var(--white);
            border: none;
            border-radius: 6px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        button[type="submit"]:hover { background: var(--navy-light); }
        button[type="submit"]:disabled { background: var(--ink-soft); cursor: not-allowed; }

        .fila-activa {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .fila-activa .info { color: var(--ink); }
        .fila-activa form { margin: 0; }
        .fila-activa button[type="submit"] {
            margin-top: 0;
            background: var(--white);
            color: var(--navy);
            border: 1px solid var(--navy);
        }
        .fila-activa button[type="submit"]:hover { background: var(--paper); }

        .countdown {
            display: inline-block;
            margin-left: 10px;
            padding: 3px 10px;
            border-radius: 999px;
            font-variant-numeric: tabular-nums;
            font-size: 13px;
            font-weight: 600;
            background: var(--success-bg);
            color: var(--success);
        }
        .countdown.por-vencer { background: #FCF3D9; color: #8A6116; }
        .countdown.vencido { background: var(--danger-bg); color: var(--danger); }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="header-inner">
            <a href="{% url 'index' %}" class="brand">PodiumFit</a>
            {% if user.is_authenticated %}
            <nav class="app-nav">
                <a href="{% url 'index' %}">Inicio</a>
                <a href="{% url 'reservar_espacio' %}">Espacios</a>
                <a href="{% url 'reservar_indumentaria' %}">Indumentaria</a>
            </nav>
            <form class="logout-form" method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="logout-btn">Cerrar sesión</button>
            </form>
            {% endif %}
        </div>
    </header>
    <main class="app-main">
        {% block content %}
        <h1>¿Qué deseas reservar?</h1>
        <a href="{% url 'reservar_espacio' %}" class="boton">Reservar un Espacio</a>
        <a href="{% url 'reservar_indumentaria' %}" class="boton">Reservar Indumentaria Deportiva</a>
        {% endblock %}
    </main>
    <script>
        // Los tiempos de cada reserva activa se van descontando en vivo.
        // Cada elemento .countdown trae en data-fin la fecha/hora ISO en la
        // que vence la reserva; aquí se calcula el restante segundo a segundo.
        (function () {
            function actualizarCountdowns() {
                document.querySelectorAll(".countdown[data-fin]").forEach(function (el) {
                    var fin = new Date(el.getAttribute("data-fin")).getTime();
                    var ahora = Date.now();
                    var restanteMs = fin - ahora;

                    if (isNaN(fin)) {
                        return;
                    }

                    if (restanteMs <= 0) {
                        el.textContent = "Tiempo agotado";
                        el.classList.remove("por-vencer");
                        el.classList.add("vencido");
                        return;
                    }

                    var totalSegundos = Math.floor(restanteMs / 1000);
                    var minutos = Math.floor(totalSegundos / 60);
                    var segundos = totalSegundos % 60;
                    var texto = minutos + ":" + String(segundos).padStart(2, "0") + " restantes";
                    el.textContent = texto;

                    el.classList.remove("vencido", "por-vencer");
                    if (restanteMs <= 5 * 60 * 1000) {
                        el.classList.add("por-vencer");
                    }
                });
            }
            actualizarCountdowns();
            setInterval(actualizarCountdowns, 1000);
        })();
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
