server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/v2/cuentas/ {
        set $cuentas_backend cuentas;
        rewrite ^/api/v2/cuentas/(.*)$ /$1 break;
        proxy_pass http://$cuentas_backend:5000;
    }

    location /api/v2/datos/ {
        set $datos_backend datos;
        rewrite ^/api/v2/datos/(.*)$ /$1 break;
        proxy_pass http://$datos_backend:5000;
    }

    location /api/v1/ {
        set $django_backend django;
        proxy_pass http://$django_backend:8000;
    }

    location / {
        set $django_backend django;
        proxy_pass http://$django_backend:8000;
    }
}
